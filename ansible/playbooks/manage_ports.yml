---
- name: Управление портами
  hosts: switches
  gather_facts: false

  tasks:
    - name: Управление портами
      cisco.ios.ios_config:
        lines:
          - "{{ port_action }}"
        parents: "interface {{ item }}"
      loop: "{{ selected_ports }}"
      register: port_result

    - name: Вывести результат
      ansible.builtin.debug:
        msg: "Applied '{{ port_action }}' to {{ selected_ports | join(', ') }}"
