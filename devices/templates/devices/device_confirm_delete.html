{% extends 'devices/base.html' %}

{% block content %}

<div class="header">
    <h1>Удалить коммутатор</h1>
    <p>Подтвердите удаление устройства</p>
</div>

<div class="card">
    <p>
        Вы действительно хотите удалить коммутатор
        <strong>{{ device.name }}</strong>
        с IP-адресом
        <strong>{{ device.ip_address }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="actions">
            <button class="btn btn-red" type="submit">Да, удалить</button>
            <a class="btn btn-gray" href="{% url 'devices:device_detail' device.pk %}">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
